# dsh-deepseek-balance-plus bundle patch
#
# Installed through the official channel:
#   dsh plugin --profile web add dsh-deepseek-balance-plus
# The command appends this package to dsh.profile.bundles; the profile boot
# merges THIS patch (a single `insert` of the plugin row) into the layer stack.
- insert:
    - id: deepseek-balance
      name: 'dsh-deepseek-balance-plus'
